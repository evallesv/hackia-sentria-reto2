# fly.toml app configuration file generated for sentria on 2026-09-27T19:18:05-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sentria'
primary_region = 'iad'

[build]

[env]
  DEMO_AUTH_ENABLED = 'true'
  DEMO_USERNAME = 'jurado'
  # Credencial compartida de evaluación, publicada en README por solicitud del equipo.
  DEMO_PASSWORD = 'Sentria-Reto2-2026!'
  STANDARD_TARIFF_ENABLED = 'true'
  # Base nueva para el esquema actual; se conserva intacta la base antigua.
  DATABASE_URL = 'sqlite:////srv/sentria/storage/sentria-v2.db'

[mounts]
  source = 'sentria_data'
  destination = '/srv/sentria/storage'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
