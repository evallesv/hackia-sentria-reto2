# Archivo autónomo: docker compose --env-file .env -f compose.oracle.yaml up -d --build
services:
  web:
    build: .
    platform: linux/arm64
    environment:
      AI_MODE: ${AI_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ENABLE_CUSTOM_INPUT: "false"
      LLM_MAX_CALLS_PER_PROCESS: "20"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
  proxy:
    image: caddy:2-alpine
    platform: linux/arm64
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Configura DEMO_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Configura ACME_EMAIL en .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
