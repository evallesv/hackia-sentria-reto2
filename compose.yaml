services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AI_MODE: ${AI_MODE:-mock}
      ENABLE_CUSTOM_INPUT: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      LLM_MAX_CALLS_PER_PROCESS: "20"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
