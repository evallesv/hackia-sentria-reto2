[project]
name = "sentria"
version = "0.1.0"
description = "Reto 2: auditoría asistida de facturas de siniestros"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "google-genai>=2.0,<3",
  "python-multipart>=0.0.32",
  "pypdf>=5,<7",
  "openpyxl>=3.1.5,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
documents = ["pypdf>=5,<7", "openpyxl>=3.1.5,<4", "reportlab>=4.3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
